spring.application.name=threatbrief

threatbrief.pregenerate.enabled=true

# Rate Limiting Configuration
threatbrief.rate-limit.enabled=true
threatbrief.rate-limit.chat.capacity=10
threatbrief.rate-limit.chat.refill-tokens=10
threatbrief.rate-limit.chat.refill-duration-seconds=60
threatbrief.rate-limit.brief.capacity=30
threatbrief.rate-limit.brief.refill-tokens=30
threatbrief.rate-limit.brief.refill-duration-seconds=60

llm.provider=huggingface
huggingface.api.token=${HUGGINGFACE_API_TOKEN:dummy-token}
huggingface.model.id=zai-org/GLM-5.3-Flash:deepinfra
huggingface.max.tokens=${HUGGINGFACE_MAX_TOKENS:10000}
huggingface.temperature=${HUGGINGFACE_TEMPERATURE:0.3}
huggingface.frequency_penalty=${HUGGINGFACE_FREQUENCY_PENALTY:0.5}
